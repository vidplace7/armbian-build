# Use case configuration for the Nintendo Switch (HAC-001)
#
# Tegra X1 AHUB (tegra-ape, "nvidia,tegra210-audio-graph-card") driving a
# Realtek ALC5639 over I2S1/DAP1, handled by the rt5640 codec driver.

Syntax 4

SectionUseCase."HiFi" {
	File "/Tegra/rt5640/Nintendo-Switch-HiFi.conf"
	Comment "Play HiFi quality Music"
}
