# Use case configuration for the Nintendo Switch (HAC-001)
#
# The APE card is a DPCM card: what userspace opens are the ADMAIF front-ends,
# and the AHUB crossbar routes them to the I2S back-ends. The crossbar powers up
# as "None", so nothing reaches the ALC5639 until the verb wires ADMAIF1 to
# I2S1 - that is the one part of this profile that is not generic rt5640.
#
# Outputs are the two internal speakers (SPO, class-D) and the headset jack
# (HPO). The jack has a plain detect switch on PV6 which the board DT exposes
# through the card's "Headphones Jack" control.

Define.HaveAif "1"
Define.HaveSpeaker "2"
Define.HaveInternalMic ""
Define.HaveHeadsetMic "1"

SectionVerb {
	Include.e.File "/codecs/rt5640/EnableSeq.conf"

	EnableSequence [
		cset "name='I2S1 Mux' ADMAIF1"
		cset "name='ADMAIF1 Mux' I2S1"
	]

	DisableSequence [
		cset "name='ADMAIF1 Mux' None"
		cset "name='I2S1 Mux' None"
	]
}

Include.spk.File "/codecs/rt5640/Speaker.conf"

# Same routing as /codecs/rt5640/HeadPhones.conf, spelled out rather than
# included because of JackControl: graph_util_card_probe() names the jack after
# the DAPM pin that simple_util_init_hp() gates, and that pin is "Headphones"
# here, so the control is "Headphones Jack" and not the "Headphone Jack" the
# shared file hardcodes. A Value in an including file does not override one from
# the included file, so there is no way to fix that up after the fact.
SectionDevice."Headphones" {
	Comment "Headphones"

	ConflictingDevice [
		"Speaker"
	]

	EnableSequence [
		cset "name='HPO MIX HPVOL Switch' on"
		cset "name='HP Channel Switch' on"
		cset "name='HP L Playback Switch' on"
		cset "name='HP R Playback Switch' on"
	]

	DisableSequence [
		cset "name='HP Channel Switch' off"
		cset "name='HP L Playback Switch' off"
		cset "name='HP R Playback Switch' off"
	]

	Value {
		PlaybackPriority 300
		PlaybackPCM "hw:${CardId}"
		JackControl "Headphones Jack"
		PlaybackMixerElem "HP"
		PlaybackVolume "HP Playback Volume"
		PlaybackMasterElem "DAC1"
	}
}

# Headset microphone. The board wires the jack's mic contact to IN1, so this is
# the same routing as /codecs/rt5640/HeadsetMic2-IN1.conf - spelled out rather
# than included because that file conflicts against "Mic"/"Headset" devices
# which do not exist on this board.
SectionDevice."Headset" {
	Comment "Headset Microphone"

	EnableSequence [
		cset "name='RECMIXL BST1 Switch' on"
		cset "name='RECMIXR BST1 Switch' on"

		cset "name='Stereo ADC MIXL ADC1 Switch' on"
		cset "name='Stereo ADC MIXR ADC1 Switch' on"
		cset "name='Mono ADC MIXL ADC1 Switch' on"
		cset "name='Mono ADC MIXR ADC1 Switch' on"
	]

	DisableSequence [
		cset "name='Stereo ADC MIXL ADC1 Switch' off"
		cset "name='Stereo ADC MIXR ADC1 Switch' off"
		cset "name='Mono ADC MIXL ADC1 Switch' off"
		cset "name='Mono ADC MIXR ADC1 Switch' off"

		cset "name='RECMIXL BST1 Switch' off"
		cset "name='RECMIXR BST1 Switch' off"
	]

	Value {
		CapturePriority 300
		CapturePCM "hw:${CardId}"
		JackControl "Headphones Jack"
		CaptureMixerElem "IN1 Boost"
		CaptureVolume "IN1 Boost"
		CaptureMasterElem "ADC"
	}
}
