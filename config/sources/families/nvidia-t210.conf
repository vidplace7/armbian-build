ARCH="arm64"

BOOTSOURCE='https://github.com/mojyack/u-boot'
BOOTBRANCH='branch:t210-develop'
BOOTPATCHDIR="u-boot-nvidia-t210"
UBOOT_TARGET_MAP=";;u-boot.bin bl31.bin"
BOOTDIR='u-boot-nvidia-t210'
declare -g SRC_EXTLINUX="yes"

LINUXFAMILY="nvidia-t210"

declare -g ATFSOURCE="https://gitlab.com/switchroot/bootstack/switch-atf"
declare -g ATFDIR="arm-trusted-firmware-nvidia-t210"
declare -g ATFBRANCH="branch:switch-v3-atf2.6"
declare -g ATFPATCHDIR="atf-nvidia-t210"
# TZDRAM_BASE must match hekate. The tree defaults to the stock Nvidia
# 0xFF800000, but hekate loads bl31.bin at 0xFFF00000 and jumps there. BL31 is
# not position independent, so the default puts every absolute address 7 MiB
# low and BL31 dies before any console exists.
# RESET_TO_BL31 is mandatory too. hekate enters BL31 out of reset, so BL31 sets
# up SCTLR_EL3 itself. The flag also zeroes x0-x3, which makes tegra read its
# parameters from PMC secure scratch 108/109/110, where hekate puts them.
declare -g ATF_TARGET_MAP="PLAT=tegra TARGET_SOC=t210 RESET_TO_BL31=1 TZDRAM_BASE=0xFFF00000 bl31;;build/tegra/t210/release/bl31.bin"
declare -g ATF_SKIP_LDFLAGS_WL="yes"

case "${BRANCH}" in

	edge)
		KERNELSOURCE='https://github.com/mojyack/linux'
		KERNELBRANCH="branch:t210-develop"
		declare -g KERNEL_MAJOR_MINOR="7.3"
		KERNELPATCHDIR="nvidia-t210-${BRANCH}"
		LINUXCONFIG="linux-nvidia-t210-${BRANCH}"
		;;

esac

write_uboot_platform() {
	echo "Please manually use fastboot to write u-boot."

}

# Mesa 25.0.7 (trixie) makes the Tegra210 GPU reject draws (nouveau DATA_ERROR),
# and the desktop stays black. Use Mesa from trixie-backports. Desktop only.
function post_family_tweaks__nvidia_t210_trixie_mesa_backports_pin() {
	if [[ "${DISTRIBUTION}" != "Debian" || "${RELEASE}" != "trixie" || "${BUILD_DESKTOP}" != "yes" ]]; then
		display_alert "Skipping Mesa backports pin" "${DISTRIBUTION} ${RELEASE} desktop=${BUILD_DESKTOP}" "info"
		return 0
	fi

	display_alert "Pinning Mesa to trixie-backports" "${BOARD}" "info"

	install -d -m755 "${SDCARD}/etc/apt/preferences.d"
	cat > "${SDCARD}/etc/apt/preferences.d/armbian-mesa-from-backports" <<-'EOF_PIN'
		Package: src:mesa
		Pin: release n=trixie-backports
		Pin-Priority: 990
	EOF_PIN

	do_with_retries 3 chroot_sdcard_apt_get_update
	do_with_retries 3 chroot_sdcard_apt_get full-upgrade
}

# Stock Mesa crashes Xorg glamor and KWin on Tegra210. The nintendo-nx PPA ships mojyack's Mesa fork.
# The PPA has only 'resolute'. Pin it: its "27.0.0~git" version is lower than any Ubuntu 27.0 upload.
function post_family_tweaks__nvidia_t210_nintendo_nx_ppa() {
	if [[ "${DISTRIBUTION}" != "Ubuntu" || "${RELEASE}" != "resolute" ]]; then
		display_alert "Skipping nintendo-nx PPA" "${DISTRIBUTION} ${RELEASE}" "info"
		return 0
	fi

	declare key_url="https://keyserver.ubuntu.com/pks/lookup?op=get&options=mr&search=0x7C145B83DA351732ECB6CF9251C4C4F2199B3BDB"
	display_alert "Adding nintendo-nx PPA" "${BOARD}" "info"

	run_host_command_logged curl --fail --silent --show-error --location --retry 3 --output "${SDCARD}/usr/share/keyrings/nintendo-nx-ppa.asc" "${key_url@Q}"
	cat > "${SDCARD}/etc/apt/sources.list.d/nintendo-nx-ppa.sources" <<-EOF_PPA
		Types: deb
		URIs: https://ppa.launchpadcontent.net/vidplace7/nintendo-nx/ubuntu/
		Suites: ${RELEASE}
		Components: main
		Signed-By: /usr/share/keyrings/nintendo-nx-ppa.asc
	EOF_PPA

	install -d -m755 "${SDCARD}/etc/apt/preferences.d"
	cat > "${SDCARD}/etc/apt/preferences.d/armbian-mesa-from-nintendo-nx-ppa" <<-'EOF_PIN'
		Package: src:mesa
		Pin: release o=LP-PPA-vidplace7-nintendo-nx
		Pin-Priority: 990
	EOF_PIN

	do_with_retries 3 chroot_sdcard_apt_get_update
	do_with_retries 3 chroot_sdcard_apt_get full-upgrade
}
