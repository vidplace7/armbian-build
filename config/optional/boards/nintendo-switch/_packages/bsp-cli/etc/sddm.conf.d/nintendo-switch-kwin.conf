# Run the greeter on KWin Wayland, with the legacy KMS workaround of the Plasma session.
# See /etc/systemd/user/plasma-kwin_wayland.service.d/nintendo-switch-legacy-kms.conf
[General]
DisplayServer=wayland
GreeterEnvironment=QT_WAYLAND_SHELL_INTEGRATION=layer-shell,KWIN_DRM_NO_AMS=1

[Wayland]
CompositorCommand=kwin_wayland --drm --no-lockscreen --no-global-shortcuts --locale1
